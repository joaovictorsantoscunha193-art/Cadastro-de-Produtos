<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cadastro Produto</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <!-- HEADER -->
        <header>
            <h1>CADASTRO DE PRODUTOS</h1>
            <p>Aqui haverá um cadastro de produtos.</p>
        </header>

        <main>
            <!-- FORMULÁRIO -->
            <form class="formulario">
                <h5>ADICIONE UM PRODUTO AQUI:</h5>

                <label for="nome"><strong>Nome</strong></label>
                <input type="text" id="nome" placeholder="Digite aqui" required>

                <label for="valor"><strong>Valor R$</strong></label>
                <input type="number" id="valor" placeholder="Digite aqui o valor" min="0" step="0.01" required>

                <select id="categoria" required>
                    <option value="Eletrônicos">Eletrônicos</option>
                    <option value="Periféricos">Periféricos</option>
                </select>

                <button type="submit">Salvar Produto</button>
            </form>

            <!-- FILTRO -->
            <div class="barra-filtros">
                <input type="text" id="busca" placeholder="Buscar Produto">

                <div class="botoes-filtro">
                    <button type="button" class="filtro ativo" data-categoria="todos">Todos</button>
                    <button type="button" class="filtro" data-categoria="Eletrônicos">Eletrônicos</button>
                    <button type="button" class="filtro" data-categoria="Periféricos">Periféricos</button>
                </div>
            </div>

            <!-- LISTA -->
            <section id="lista"></section>
        </main>

        <script src="script.js"></script>
    </body>
</html>
